<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Ecosystem</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .header { background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .header h1 span { color: #7c3aed; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 6px; }
  .status-dot.offline { background: #ef4444; }
  .status-text { font-size: 12px; color: #888; }

  /* Login */
  #login-screen { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 32px; width: 340px; }
  .login-box h2 { margin-bottom: 24px; font-size: 20px; color: #fff; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input { width: 100%; background: #0f0f0f; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; color: #e0e0e0; font-size: 14px; outline: none; }
  .form-group input:focus { border-color: #7c3aed; }
  .btn { width: 100%; background: #7c3aed; border: none; border-radius: 8px; padding: 11px; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn:hover { background: #6d28d9; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg { color: #f87171; font-size: 13px; margin-top: 10px; text-align: center; }

  /* Main layout */
  #main-screen { flex: 1; display: none; overflow: hidden; min-height: 0; }
  .layout { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 49px); min-height: 0; }

  /* Sidebar */
  .sidebar { background: #141414; border-right: 1px solid #2a2a2a; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
  .sidebar-section { padding: 16px; border-bottom: 1px solid #2a2a2a; flex-shrink: 0; }
  .sidebar-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #555; margin-bottom: 12px; }

  /* Upload */
  .upload-area { border: 2px dashed #333; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
  .upload-area:hover, .upload-area.dragover { border-color: #7c3aed; }
  .upload-area p { font-size: 12px; color: #666; margin-top: 6px; }
  .upload-icon { font-size: 24px; }
  #file-input { display: none; }
  .upload-progress { margin-top: 10px; display: none; }
  .progress-bar { height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #7c3aed; border-radius: 2px; transition: width 0.3s; }
  .progress-text { font-size: 11px; color: #888; margin-top: 4px; }

  /* Documents list */
  .docs-list { flex: 1; overflow-y: auto; padding: 8px; }
  .doc-item { padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; cursor: default; }
  .doc-item:hover { background: #1e1e1e; }
  .doc-name { font-size: 13px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-meta { font-size: 11px; color: #555; margin-top: 2px; display: flex; gap: 8px; }
  .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .badge-completed { background: #14532d; color: #4ade80; }
  .badge-queued { background: #1c1917; color: #a8a29e; }
  .badge-processing { background: #1e1b4b; color: #818cf8; }
  .badge-failed { background: #450a0a; color: #f87171; }
  .no-docs { text-align: center; padding: 24px; color: #444; font-size: 13px; }

  /* Refresh button */
  .refresh-btn { background: none; border: 1px solid #333; border-radius: 6px; color: #888; padding: 4px 10px; font-size: 11px; cursor: pointer; width: 100%; }
  .refresh-btn:hover { border-color: #555; color: #ccc; }

  /* Chat */
  .chat-area { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; min-height: 0; scroll-behavior: smooth; }
  .welcome { text-align: center; margin: auto; color: #444; }
  .welcome h2 { font-size: 28px; color: #7c3aed; margin-bottom: 8px; }
  .welcome p { font-size: 14px; }

  .message { max-width: 75%; }
  .message.user { align-self: flex-end; }
  .message.assistant { align-self: flex-start; }
  .message-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .message.user .message-bubble { background: #7c3aed; color: #fff; border-bottom-right-radius: 4px; }
  .message.assistant .message-bubble { background: #1e1e1e; color: #e0e0e0; border-bottom-left-radius: 4px; border: 1px solid #2a2a2a; }
  .message-meta { font-size: 11px; color: #555; margin-top: 6px; display: flex; gap: 10px; }
  .message.user .message-meta { justify-content: flex-end; }

  .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .source-item { background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #888; line-height: 1.5; }
  .source-item strong { color: #7c3aed; font-size: 11px; display: block; margin-bottom: 4px; }

  .thinking { display: flex; align-items: center; gap: 8px; color: #555; font-size: 13px; padding: 8px 0; }
  .dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #555; animation: bounce 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* Input */
  .chat-input-area { padding: 16px 24px; border-top: 1px solid #1e1e1e; background: #141414; flex-shrink: 0; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  .input-row textarea { flex: 1; background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 10px; padding: 11px 14px; color: #e0e0e0; font-size: 14px; resize: none; outline: none; min-height: 44px; max-height: 120px; font-family: inherit; line-height: 1.5; }
  .input-row textarea:focus { border-color: #7c3aed; }
  .send-btn { background: #7c3aed; border: none; border-radius: 10px; width: 44px; height: 44px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send-btn:hover { background: #6d28d9; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; fill: white; }
  .input-hint { font-size: 11px; color: #444; margin-top: 6px; text-align: center; }

  /* Scroll to bottom button */
  .scroll-btn { position: absolute; bottom: 90px; right: 24px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 16px; color: #aaa; z-index: 10; }
  .scroll-btn:hover { background: #333; color: #fff; }
  .scroll-btn.visible { display: flex; }
  .chat-area { position: relative; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>RAG <span>Ecosystem</span></h1>
  <div>
    <span class="status-dot" id="status-dot"></span>
    <span class="status-text" id="status-text">Conectando...</span>
  </div>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h2>Iniciar sesión</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="login-email" value="admin@demo.com" placeholder="admin@demo.com">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-password" value="admin123" placeholder="contraseña">
    </div>
    <button class="btn" id="login-btn" onclick="login()">Entrar</button>
    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-screen">
  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Subir Documento</h3>
        <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
          <div class="upload-icon">📄</div>
          <p>PDF · Word · Excel · CSV · JSON · MD · Imagen · Audio</p>
        </div>
        <input type="file" id="file-input" accept=".txt,.pdf,.docx,.doc,.md,.rst,.html,.csv,.tsv,.xlsx,.xls,.json,.jsonl,.parquet,.jpg,.jpeg,.png,.webp,.mp3,.wav,.m4a" onchange="uploadFile(this)">
        <div class="upload-progress" id="upload-progress">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
          <div class="progress-text" id="progress-text">Subiendo...</div>
        </div>
      </div>

      <div class="sidebar-section" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
        <h3>Documentos <span id="doc-count" style="color:#555"></span></h3>
        <div class="docs-list" id="docs-list">
          <div class="no-docs">Sin documentos aún</div>
        </div>
        <button class="refresh-btn" onclick="loadDocs()">↻ Actualizar lista</button>
      </div>

      <div class="sidebar-section" style="padding:10px 16px;">
        <button class="refresh-btn" onclick="logout()" style="color:#f87171;border-color:#450a0a;">Cerrar sesión</button>
      </div>
    </div>

    <!-- CHAT -->
    <div class="chat-area">
      <button class="scroll-btn" id="scroll-btn" onclick="scrollToBottom()" title="Ir al final">↓</button>
      <div class="chat-messages" id="chat-messages" onscroll="onChatScroll()">
        <div class="welcome">
          <h2>Hola 👋</h2>
          <p>Sube documentos y hazme preguntas sobre ellos.</p>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="input-row">
          <textarea id="query-input" placeholder="Haz una pregunta sobre tus documentos..." rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendQuery()}"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
          <button class="send-btn" id="send-btn" onclick="sendQuery()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
        <div class="input-hint">Enter para enviar · Shift+Enter para nueva línea</div>
      </div>
    </div>

  </div>
</div>

<script>
const API = 'http://127.0.0.1:8003';
let token = localStorage.getItem('rag_token') || '';

// ── Init ──────────────────────────────────────────────────────────
async function init() {
  const ok = await checkHealth();
  if (!ok) return;
  if (token) {
    try {
      await loadDocs();
      showMain();
    } catch {
      token = '';
      localStorage.removeItem('rag_token');
    }
  }
}

async function checkHealth() {
  try {
    const r = await fetch(`${API}/health`);
    const ok = r.ok;
    document.getElementById('status-dot').className = 'status-dot' + (ok ? '' : ' offline');
    document.getElementById('status-text').textContent = ok ? 'API conectada' : 'API offline';
    return ok;
  } catch {
    document.getElementById('status-dot').className = 'status-dot offline';
    document.getElementById('status-text').textContent = 'API offline';
    return false;
  }
}

// ── Auth ──────────────────────────────────────────────────────────
async function login() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = 'Entrando...'; err.textContent = '';
  try {
    const r = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('login-email').value,
        password: document.getElementById('login-password').value
      })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Error de autenticación');
    token = data.access_token;
    localStorage.setItem('rag_token', token);
    await loadDocs();
    showMain();
  } catch(e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

function logout() {
  token = ''; localStorage.removeItem('rag_token');
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'flex';
}

// ── Documents ─────────────────────────────────────────────────────
async function loadDocs() {
  const r = await fetch(`${API}/ingest/documents`, { headers: authHeaders() });
  if (!r.ok) throw new Error('No autorizado');
  const data = await r.json();
  const list = document.getElementById('docs-list');
  const count = document.getElementById('doc-count');
  count.textContent = `(${data.total})`;
  if (!data.documents.length) {
    list.innerHTML = '<div class="no-docs">Sin documentos aún</div>';
    return;
  }
  list.innerHTML = data.documents.map(d => `
    <div class="doc-item">
      <div class="doc-name" title="${d.filename}">${d.filename}</div>
      <div class="doc-meta">
        <span class="badge badge-${d.status}">${d.status}</span>
        <span>${d.chunk_count} chunks</span>
      </div>
    </div>
  `).join('');
}

// ── Upload ────────────────────────────────────────────────────────
async function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const progress = document.getElementById('upload-progress');
  const fill = document.getElementById('progress-fill');
  const text = document.getElementById('progress-text');
  progress.style.display = 'block';
  fill.style.width = '30%'; text.textContent = 'Subiendo archivo...';

  try {
    const form = new FormData();
    form.append('file', file);
    const r = await fetch(`${API}/ingest/file`, {
      method: 'POST', headers: authHeaders(), body: form
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Error al subir');
    fill.style.width = '70%'; text.textContent = 'Procesando...';
    // Poll status
    await pollJob(data.job_id, fill, text);
    await loadDocs();
  } catch(e) {
    text.textContent = '❌ ' + e.message;
    fill.style.background = '#ef4444';
  }
  input.value = '';
  setTimeout(() => { progress.style.display = 'none'; fill.style.width = '0%'; fill.style.background = '#7c3aed'; }, 3000);
}

async function pollJob(jobId, fill, text) {
  for (let i = 0; i < 30; i++) {
    await sleep(2000);
    const r = await fetch(`${API}/ingest/status/${jobId}`, { headers: authHeaders() });
    const d = await r.json();
    if (d.status === 'success') { fill.style.width = '100%'; text.textContent = '✅ Procesado correctamente'; return; }
    if (d.status === 'failure') { throw new Error('Falló el procesamiento: ' + (d.result || '')); }
    fill.style.width = (70 + i) + '%';
    text.textContent = `Procesando... (${d.status})`;
  }
}

// ── Drag & Drop ───────────────────────────────────────────────────
const area = document.getElementById('upload-area');
area.addEventListener('dragover', e => { e.preventDefault(); area.classList.add('dragover'); });
area.addEventListener('dragleave', () => area.classList.remove('dragover'));
area.addEventListener('drop', e => {
  e.preventDefault(); area.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) { const dt = new DataTransfer(); dt.items.add(file); document.getElementById('file-input').files = dt.files; uploadFile(document.getElementById('file-input')); }
});

// ── Query ─────────────────────────────────────────────────────────
async function sendQuery() {
  const input = document.getElementById('query-input');
  const query = input.value.trim();
  if (!query) return;
  input.value = ''; input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  const msgs = document.getElementById('chat-messages');
  // Remove welcome if present
  const welcome = msgs.querySelector('.welcome');
  if (welcome) welcome.remove();

  // User bubble
  msgs.innerHTML += `
    <div class="message user">
      <div class="message-bubble">${escHtml(query)}</div>
    </div>`;

  // Thinking indicator
  const thinkId = 'think-' + Date.now();
  msgs.innerHTML += `
    <div class="message assistant" id="${thinkId}">
      <div class="thinking">
        <div class="dots"><span></span><span></span><span></span></div>
        Buscando en tus documentos...
      </div>
    </div>`;
  scrollToBottom();

  try {
    const r = await fetch(`${API}/query`, {
      method: 'POST',
      headers: {...authHeaders(), 'Content-Type':'application/json'},
      body: JSON.stringify({ query })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Error en la consulta');

    const sources = (data.sources || [])
      .filter((s, i, arr) => arr.findIndex(x => x.chunk_index === s.chunk_index && x.source_id === s.source_id) === i)
      .slice(0, 3);

    const sourcesHtml = sources.length ? `
      <div class="sources">
        ${sources.map(s => `
          <div class="source-item">
            <strong>📄 ${escHtml(s.source_id)} · chunk ${s.chunk_index}</strong>
            ${escHtml(s.text.substring(0, 150))}${s.text.length > 150 ? '...' : ''}
          </div>`).join('')}
      </div>` : '';

    const meta = [
      data.model ? `🤖 ${data.model.replace('claude-','').replace('-20251001','')}` : '',
      data.latency_ms ? `⚡ ${(data.latency_ms/1000).toFixed(1)}s` : '',
      data.cached ? '💾 desde caché' : '',
      data.cost_usd ? `💰 $${data.cost_usd.toFixed(4)}` : '',
    ].filter(Boolean).join(' · ');

    document.getElementById(thinkId).outerHTML = `
      <div class="message assistant">
        <div class="message-bubble">${escHtml(data.answer || 'Sin respuesta')}${sourcesHtml}</div>
        <div class="message-meta">${meta}</div>
      </div>`;
  } catch(e) {
    document.getElementById(thinkId).outerHTML = `
      <div class="message assistant">
        <div class="message-bubble" style="color:#f87171">❌ ${escHtml(e.message)}</div>
      </div>`;
  }

  scrollToBottom();
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ── Scroll ────────────────────────────────────────────────────────
function scrollToBottom(smooth = true) {
  const msgs = document.getElementById('chat-messages');
  msgs.scrollTo({ top: msgs.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
}

function onChatScroll() {
  const msgs = document.getElementById('chat-messages');
  const btn = document.getElementById('scroll-btn');
  const distFromBottom = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight;
  btn.classList.toggle('visible', distFromBottom > 120);
}

// ── Utils ─────────────────────────────────────────────────────────
function authHeaders() { return { 'Authorization': 'Bearer ' + token }; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── Start ─────────────────────────────────────────────────────────
init();
setInterval(checkHealth, 15000);
</script>
</body>
</html>
