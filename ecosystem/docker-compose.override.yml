# ============================================================
# OVERRIDE PARA DESARROLLO LOCAL (16 GB RAM)
# Uso: docker compose up -d  (se aplica automáticamente)
# Producción: docker compose -f docker-compose.yml up -d
# ============================================================

services:
  elasticsearch:
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - indices.memory.index_buffer_size=10%
      - indices.fielddata.cache.size=10%
      - thread_pool.write.queue_size=100
    deploy:
      resources:
        limits:
          memory: 1500M
          cpus: '2'
        reservations:
          memory: 768M

  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache__size: 512m
    deploy:
      resources:
        limits:
          memory: 1200M
          cpus: '2'
        reservations:
          memory: 768M

  rabbitmq:
    environment:
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.4
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M

  clickhouse:
    environment:
      - CLICKHOUSE_MAX_SERVER_MEMORY_USAGE=400000000
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
        reservations:
          memory: 256M

  langfuse-web:
    environment:
      - NODE_OPTIONS=--max-old-space-size=768
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M

  langfuse-worker:
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1'
        reservations:
          memory: 384M

  traefik:
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=rag-network"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
